<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdul Wahid — University Repository</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0066cc;
            --primary-dark: #0052a3;
            --secondary: #6f42c1;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #1a1a2e;
            --darker: #16213e;
            --text: #e6edf3;
            --text-muted: #8b949e;
            --border: #30363d;
            --bg: #0d1117;
            --bg-secondary: #161b22;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--darker);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 2px solid var(--border);
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #0066cc, #6f42c1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Upload Section */
        .upload-section {
            background: linear-gradient(135deg, var(--bg-secondary), rgba(111, 66, 193, 0.1));
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            border-color: var(--secondary);
            background: linear-gradient(135deg, rgba(111, 66, 193, 0.15), rgba(111, 66, 193, 0.2));
        }

        .upload-section h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .upload-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .form-group input[type="file"] {
            padding: 10px 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #5a36a3;
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .token-info {
            background: rgba(40, 167, 69, 0.1);
            border-left: 4px solid var(--success);
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .token-info a {
            color: var(--primary);
            text-decoration: none;
        }

        .token-info a:hover {
            text-decoration: underline;
        }

        /* Status Messages */
        .status {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: rgba(40, 167, 69, 0.1);
            border-left: 4px solid var(--success);
            color: #68dd6f;
        }

        .status.error {
            background: rgba(220, 53, 69, 0.1);
            border-left: 4px solid var(--danger);
            color: #ff6b7a;
        }

        .status.info {
            background: rgba(23, 162, 184, 0.1);
            border-left: 4px solid var(--info);
            color: #5dccf2;
        }

        /* File Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .course-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(0, 102, 204, 0.15);
            transform: translateY(-4px);
        }

        .course-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 20px;
            color: white;
        }

        .course-header h3 {
            font-size: 18px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .course-icon {
            font-size: 24px;
        }

        .course-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .file-list {
            list-style: none;
            margin-bottom: 15px;
            flex: 1;
        }

        .file-item {
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(0, 102, 204, 0.05);
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: rgba(0, 102, 204, 0.1);
            padding-left: 15px;
        }

        .file-item a {
            color: var(--primary);
            text-decoration: none;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .file-icon {
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .course-footer {
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .course-footer .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
        }

        /* Refresh Button */
        .refresh-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-refresh {
            background: var(--info);
            color: white;
            padding: 12px 32px;
        }

        .btn-refresh:hover {
            background: #138496;
        }

        .btn-refresh.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Loading State */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .upload-controls {
                flex-direction: column;
            }

            .form-group {
                min-width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>📚 University Repository</h1>
            <p class="subtitle">Abdul Wahid — COMSATS University Islamabad, Attock Campus</p>
        </div>

        <!-- Status Messages -->
        <div id="status" class="status"></div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2>➕ Upload Files</h2>
            <div class="upload-controls">
                <div class="form-group">
                    <label for="token">GitHub Token *</label>
                    <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxx">
                </div>
                <div class="form-group">
                    <label for="folder">Select Folder *</label>
                    <select id="folder">
                        <option value="">-- Choose a folder --</option>
                        <option value="KRaR">KRaR</option>
                        <option value="OS">OS</option>
                        <option value="PAI">PAI</option>
                        <option value="S">S</option>
                        <option value="Web">Web</option>
                        <option value="DAA">DAA</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="file">Select File *</label>
                    <input type="file" id="file">
                </div>
                <button class="btn btn-primary" onclick="uploadFile()">
                    <span>📤</span> Upload
                </button>
            </div>
            <div class="token-info">
                💡 Need a token? Create one at <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings → Developer settings → Personal access tokens</a> with "repo" scope
            </div>
        </div>

        <!-- Refresh Section -->
        <div class="refresh-container">
            <button class="btn btn-refresh" onclick="refreshData()">
                <span id="refresh-icon">🔄</span> Refresh Files
            </button>
        </div>

        <!-- Courses Grid -->
        <div id="coursesContainer" class="courses-grid">
            <div style="text-align: center; grid-column: 1/-1;">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: var(--text-muted);">Loading files...</p>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>✨ Files auto-update when you refresh the page | Last loaded: <span id="lastUpdate">--</span></p>
        </footer>
    </div>

    <script>
        const OWNER = 'abduIwahid';
        const REPO = '5';
        const BRANCH = 'main';
        const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

        // Course configuration
        const COURSE_CONFIG = {
            'KRaR': { name: 'KRaR', icon: '📋', color: '#0066cc' },
            'OS': { name: 'Operating Systems', icon: '💻', color: '#6f42c1' },
            'PAI': { name: 'Pattern Analysis & Intelligence', icon: '🤖', color: '#17a2b8' },
            'S': { name: 'Semester Work', icon: '📚', color: '#28a745' },
            'Web': { name: 'Web Development', icon: '🌐', color: '#ffc107' },
            'DAA': { name: 'Design & Analysis of Algorithms', icon: '🔧', color: '#dc3545' }
        };

        let courseData = {};

        // Show status message
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
            setTimeout(() => status.classList.remove('show'), 5000);
        }

        // Load files from GitHub
        async function loadFiles() {
            try {
                document.getElementById('coursesContainer').innerHTML = '<div style="text-align: center; grid-column: 1/-1;"><div class="spinner"></div><p style="margin-top: 15px; color: var(--text-muted);">Loading files...</p></div>';
                
                courseData = {};
                
                for (const folder of Object.keys(COURSE_CONFIG)) {
                    try {
                        const response = await fetch(`${API_URL}/${folder}`, {
                            headers: { 'Accept': 'application/vnd.github.v3+json' }
                        });
                        
                        if (response.ok) {
                            const contents = await response.json();
                            courseData[folder] = Array.isArray(contents) 
                                ? contents.filter(item => item.type === 'file')
                                : [];
                        } else {
                            courseData[folder] = [];
                        }
                    } catch (e) {
                        courseData[folder] = [];
                    }
                }
                
                renderCourses();
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading files:', error);
                showStatus('Failed to load files. Check console.', 'error');
            }
        }

        // Render course cards
        function renderCourses() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            for (const [folderKey, config] of Object.entries(COURSE_CONFIG)) {
                const files = courseData[folderKey] || [];
                const card = document.createElement('div');
                card.className = 'course-card';

                const headerStyle = `style="background: linear-gradient(135deg, ${config.color}, rgba(0,0,0,0.1));"`;
                
                card.innerHTML = `
                    <div class="course-header" ${headerStyle}>
                        <h3>
                            <span class="course-icon">${config.icon}</span>
                            ${config.name}
                        </h3>
                    </div>
                    <div class="course-body">
                        ${files.length > 0 
                            ? `<ul class="file-list">
                                ${files.map(file => `
                                    <li class="file-item">
                                        <span class="file-icon">📄</span>
                                        <a href="${file.html_url}" target="_blank">${file.name}</a>
                                    </li>
                                `).join('')}
                            </ul>`
                            : `<div class="empty-state"><p>No files yet</p></div>`
                        }
                        <div class="course-footer">
                            <button class="btn btn-secondary" onclick="promptAddFile('${folderKey}')">
                                <span>➕</span> Add File
                            </button>
                            ${files.length > 0 ? `<button class="btn btn-danger" onclick="deleteFolder('${folderKey}')"><span>🗑️</span> Clear</button>` : ''}
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            }
        }

        // Upload file to GitHub
        async function uploadFile() {
            const token = document.getElementById('token').value;
            const folder = document.getElementById('folder').value;
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];

            if (!token || !folder || !file) {
                showStatus('⚠️ Please fill all fields', 'error');
                return;
            }

            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = btoa(e.target.result);
                    const uploadUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}/${file.name}`;

                    try {
                        const response = await fetch(uploadUrl, {
                            method: 'PUT',
                            headers: {
                                'Authorization': `token ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                message: `Add ${file.name} to ${folder}`,
                                content: content,
                                branch: BRANCH
                            })
                        });

                        if (response.ok) {
                            showStatus(`✅ ${file.name} uploaded successfully!`, 'success');
                            fileInput.value = '';
                            document.getElementById('token').value = '';
                            document.getElementById('folder').value = '';
                            
                            // Refresh after a short delay
                            setTimeout(loadFiles, 1500);
                        } else {
                            const error = await response.json();
                            showStatus(`❌ Upload failed: ${error.message}`, 'error');
                        }
                    } catch (error) {
                        showStatus(`❌ Error: ${error.message}`, 'error');
                    }
                };
                reader.readAsArrayBuffer(file);
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Refresh data
        function refreshData() {
            const btn = document.querySelector('.btn-refresh');
            const icon = document.getElementById('refresh-icon');
            
            btn.classList.add('loading');
            icon.innerHTML = '<span class="spinner"></span>';
            
            loadFiles().then(() => {
                btn.classList.remove('loading');
                icon.innerHTML = '🔄';
                showStatus('✅ Files refreshed!', 'success');
            });
        }

        // Delete file
        async function deleteFile(folder, fileName) {
            const token = prompt('Enter your GitHub token to delete:');
            if (!token) return;

            try {
                const deleteUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}/${fileName}`;
                
                // First, get the file to get its SHA
                const getResponse = await fetch(deleteUrl, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (getResponse.ok) {
                    const fileData = await getResponse.json();
                    
                    const deleteResponse = await fetch(deleteUrl, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Delete ${fileName}`,
                            sha: fileData.sha,
                            branch: BRANCH
                        })
                    });

                    if (deleteResponse.ok) {
                        showStatus(`✅ ${fileName} deleted!`, 'success');
                        loadFiles();
                    }
                }
            } catch (error) {
                showStatus(`❌ Delete failed: ${error.message}`, 'error');
            }
        }

        // Prompt for adding file to folder
        function promptAddFile(folder) {
            document.getElementById('folder').value = folder;
            document.getElementById('file').click();
        }

        // Delete folder
        async function deleteFolder(folder) {
            if (confirm(`Delete all files in ${folder}?`)) {
                const token = prompt('Enter your GitHub token:');
                if (!token) return;

                const files = courseData[folder] || [];
                for (const file of files) {
                    await deleteFile(folder, file.name);
                }
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadFiles);

        // Enter key to upload
        document.getElementById('file').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') uploadFile();
        });
    </script>
</body>
</html>

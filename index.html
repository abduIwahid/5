<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abdul Wahid — University Repository</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    padding: 40px 20px;
  }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .subtitle { color: #8b949e; margin-bottom: 8px; }
  .updated { color: #6e7681; font-size: 12px; margin-bottom: 40px; }
  .section {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-header {
    background: #21262d;
    padding: 12px 20px;
    font-weight: 600;
    font-size: 16px;
    border-bottom: 1px solid #30363d;
  }
  ul { list-style: none; }
  li {
    padding: 12px 20px;
    border-bottom: 1px solid #21262d;
  }
  li:last-child { border-bottom: none; }
  a {
    color: #58a6ff;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  a:hover { text-decoration: underline; }
  .status {
    text-align: center;
    color: #8b949e;
    padding: 40px;
  }
  footer {
    text-align: center;
    color: #6e7681;
    margin-top: 40px;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📚 University Repository</h1>
  <p class="subtitle">Abdul Wahid — COMSATS University Islamabad, ATTOCK Campus</p>
  <p class="updated" id="updated"></p>

  <div id="content">
    <div class="status">Loading files…</div>
  </div>

  <footer>Auto-generated from repo contents — updates automatically when files are added</footer>
</div>

<script>
const OWNER = 'abduIwahid';
const REPO = '5';
const BRANCH = 'main';

// Optional: give friendly names to folder/course codes.
// Anything not listed here just shows its folder name as-is.
const COURSE_NAMES = {
  // 'DAA': 'Design and Analysis of Algorithms',
  // 'OS': 'Operating Systems',
  // 'KRaR': 'Knowledge Representation and Reasoning',
  // 'PAI': 'Principles of AI',
  // 'S': 'Statistics',
  // 'Web': 'Web Technologies',
};

function iconFor(filename) {
  const lower = filename.toLowerCase();
  if (lower.includes('cdf')) return '📄';
  if (lower.includes('lm') || lower.includes('lab')) return '🧪';
  if (lower.includes('syllabus')) return '📘';
  if (lower.endsWith('.ipynb') || lower.endsWith('.py') || lower.endsWith('.java') || lower.endsWith('.cpp') || lower.endsWith('.c')) return '💻';
  if (lower.endsWith('.pdf')) return '📄';
  return '📁';
}

function linkFor(path) {
  if (path.toLowerCase().endsWith('.ipynb')) {
    return `https://nbviewer.org/github/${OWNER}/${REPO}/blob/${BRANCH}/${path}`;
  }
  return path; // relative — opens directly in browser via GitHub Pages
}

async function loadFiles() {
  const contentEl = document.getElementById('content');
  const updatedEl = document.getElementById('updated');
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`);
    if (!res.ok) throw new Error('API error ' + res.status);
    const data = await res.json();

    const files = data.tree.filter(item =>
      item.type === 'blob' &&
      item.path !== 'index.html' &&
      item.size > 0 &&
      item.path.includes('/') // skip root-level placeholder files
    );

    const groups = {};
    files.forEach(f => {
      const folder = f.path.split('/')[0];
      if (!groups[folder]) groups[folder] = [];
      groups[folder].push(f.path);
    });

    contentEl.innerHTML = '';
    const folderNames = Object.keys(groups).sort();

    if (folderNames.length === 0) {
      contentEl.innerHTML = '<div class="status">No files found yet.</div>';
    }

    folderNames.forEach(folder => {
      const section = document.createElement('div');
      section.className = 'section';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.textContent = COURSE_NAMES[folder] || folder;
      section.appendChild(header);

      const ul = document.createElement('ul');
      groups[folder].sort().forEach(path => {
        const filename = path.split('/').pop();
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = linkFor(path);
        a.target = '_blank';
        a.innerHTML = `${iconFor(filename)} ${filename}`;
        li.appendChild(a);
        ul.appendChild(li);
      });
      section.appendChild(ul);
      contentEl.appendChild(section);
    });

    updatedEl.textContent = 'Loaded live from repository — ' + new Date().toLocaleString();
  } catch (err) {
    contentEl.innerHTML = `<div class="status">⚠️ Couldn't load file list (${err.message}). <br>GitHub API rate limit may be reached — try again shortly.</div>`;
  }
}

loadFiles();
</script>
</body>
</html>

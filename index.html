<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA24-BAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #313851;
            --primary-dark: #313851;
            --secondary: #313851;
            --success: #313851;
            --danger: #313851;
            --warning: #313851;
            --info: #313851;
            --light: #F6F3ED;
            --light-gray: #F6F3ED;
            --gray: #C2CBD3;
            --dark-gray: #313851;
            --text: #313851;
            --text-muted: #313851;
            --border: #C2CBD3;
            --bg: #F6F3ED;
            --bg-secondary: #F6F3ED;
            --shadow: 0 4px 12px rgba(49, 56, 81, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: var(--light-gray);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px solid var(--border);
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #313851, #313851);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            color: var(--text-muted);
            font-size: 16px;
        }

        /* Upload Section */
        .upload-section {
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
        }

        .upload-section:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 24px rgba(49, 56, 81, 0.1);
        }

        .upload-section h2 {
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--text);
            font-weight: 700;
        }

        .upload-controls {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .form-group {
            flex: 1;
            min-width: 200px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(49, 56, 81, 0.1);
        }

        .form-group input[type="file"] {
            padding: 10px 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(49, 56, 81, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: #313851;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(49, 56, 81, 0.3);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-danger:hover {
            background: #313851;
        }

        .info-box {
            background: #F6F3ED;
            border-left: 4px solid #313851;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 13px;
            color: #313851;
        }

        /* Status Messages */
        .status {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status.show {
            display: block;
        }

        .status.success {
            background: #F6F3ED;
            border-left: 4px solid #313851;
            color: #313851;
        }

        .status.error {
            background: #F6F3ED;
            border-left: 4px solid #313851;
            color: #313851;
        }

        .status.info {
            background: #F6F3ED;
            border-left: 4px solid #313851;
            color: #313851;
        }

        /* Courses Grid */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .course-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }

        .course-card:hover {
            border-color: var(--primary);
            box-shadow: 0 12px 32px rgba(49, 56, 81, 0.15);
            transform: translateY(-6px);
        }

        .course-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 24px;
            color: white;
        }

        .course-header h3 {
            font-size: 20px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
        }

        .course-icon {
            font-size: 28px;
        }

        .course-body {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Folder sections */
        .folder-section {
            margin-bottom: 25px;
        }

        .folder-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .file-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .file-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            background: var(--light-gray);
            border-left: 3px solid var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: #F6F3ED;
            border-left-color: var(--primary-dark);
            transform: translateX(4px);
        }

        .file-item a {
            color: var(--primary);
            text-decoration: none;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .file-item a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .file-icon {
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .course-footer {
            display: flex;
            gap: 10px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .course-footer .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
        }

        /* Refresh Button */
        .refresh-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .btn-refresh {
            background: var(--info);
            color: white;
            padding: 12px 32px;
        }

        .btn-refresh:hover {
            background: #313851;
            box-shadow: 0 8px 16px rgba(49, 56, 81, 0.3);
        }

        .btn-refresh.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(49, 56, 81, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Loading State */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 28px;
            }

            .courses-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .upload-controls {
                flex-direction: column;
            }

            .form-group {
                min-width: 100%;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>FA24-BAI</h1>
            <p class="subtitle">COMSATS University Islamabad, Attock Campus</p>
        </div>

        <!-- Status Messages -->
        <div id="status" class="status"></div>

        <!-- Upload Section -->
        <div class="upload-section">
            <h2>Upload Files & Folders</h2>
            <div class="upload-controls">
                <div class="form-group">
                    <label for="folder">Select Course *</label>
                    <select id="folder">
                        <option value="">-- Choose a course --</option>
                        <option value="KRaR">KRaR - Knowledge Representation & Reasoning</option>
                        <option value="OS">OS - Operating Systems</option>
                        <option value="PAI">PAI - Programming for Artificial Intelligence</option>
                        <option value="S">S - Statistics and Probability Theory</option>
                        <option value="Web">Web - Web Development</option>
                        <option value="DAA">DAA - Design & Analysis of Algorithms</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="folderPath">Subfolder Path (optional)</label>
                    <input type="text" id="folderPath" placeholder="e.g., Lectures, Code, Lab">
                </div>
                <div class="form-group">
                    <label for="file">Select File *</label>
                    <input type="file" id="file">
                </div>
                <button class="btn btn-primary" onclick="uploadFile()">
                    Upload
                </button>
            </div>
            <div class="info-box">
                Upload files to organize them into courses. Create folders like 'Lectures', 'Code', 'Lab', etc.
            </div>
        </div>

        <!-- Refresh Section -->
        <div class="refresh-container">
            <button class="btn btn-refresh" onclick="refreshData()">
                <span id="refresh-icon">⟳</span> Refresh Files
            </button>
        </div>

        <!-- Courses Grid -->
        <div id="coursesContainer" class="courses-grid">
            <div style="text-align: center; grid-column: 1/-1;">
                <div class="spinner"></div>
                <p style="margin-top: 15px; color: var(--text-muted);">Loading files...</p>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Files auto-update when you refresh the page | Last loaded: <span id="lastUpdate">--</span></p>
        </footer>
    </div>

    <script>
        // Course configuration - FIXED 6 COURSES
        const COURSE_CONFIG = {
            'KRaR': { name: 'Knowledge Representation & Reasoning', icon: '▪', color: '#313851' },
            'OS': { name: 'Operating Systems', icon: '▪', color: '#313851' },
            'PAI': { name: 'Programming for Artificial Intelligence', icon: '▪', color: '#313851' },
            'S': { name: 'Statistics and Probability Theory', icon: '▪', color: '#313851' },
            'Web': { name: 'Web Development', icon: '▪', color: '#313851' },
            'DAA': { name: 'Design & Analysis of Algorithms', icon: '▪', color: '#313851' }
        };

        // Folder organization rules
        const FOLDER_CATEGORIES = {
            'lectures': { name: 'Lectures', icon: '▪' },
            'code': { name: 'Code', icon: '▪' },
            'lab': { name: 'Lab Work', icon: '▪' },
            'assignments': { name: 'Assignments', icon: '▪' },
            'resources': { name: 'Resources', icon: '▪' }
        };

        let courseData = {};

        // Show status message
        function showStatus(message, type = 'info') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status show ${type}`;
            setTimeout(() => status.classList.remove('show'), 4000);
        }

        // Load files from local storage
        function loadFiles() {
            try {
                document.getElementById('coursesContainer').innerHTML = '<div style="text-align: center; grid-column: 1/-1;"><div class="spinner"></div><p style="margin-top: 15px; color: var(--text-muted);">Loading files...</p></div>';
                
                courseData = {};
                
                // Initialize each course
                for (const folder of Object.keys(COURSE_CONFIG)) {
                    courseData[folder] = getFilesFromLocalStorage(folder);
                }
                
                renderCourses();
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
            } catch (error) {
                console.error('Error loading files:', error);
                showStatus('Failed to load files. Check console.', 'error');
            }
        }

        // Get files from local storage
        function getFilesFromLocalStorage(course) {
            const stored = localStorage.getItem(`course_${course}`);
            return stored ? JSON.parse(stored) : {};
        }

        // Save files to local storage
        function saveFilesToLocalStorage(course, data) {
            localStorage.setItem(`course_${course}`, JSON.stringify(data));
        }

        // Organize files by folder
        function organizeFiles(files) {
            const organized = {};
            
            files.forEach(file => {
                const parts = file.path.split('/');
                const folder = parts.length > 1 ? parts[0].toLowerCase() : 'root';
                
                if (!organized[folder]) {
                    organized[folder] = [];
                }
                organized[folder].push(file);
            });
            
            return organized;
        }

        // Render course cards
        function renderCourses() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = '';

            for (const [folderKey, config] of Object.entries(COURSE_CONFIG)) {
                const filesObj = courseData[folderKey] || {};
                const files = Object.values(filesObj).flat() || [];
                const organized = organizeFiles(files);
                
                const card = document.createElement('div');
                card.className = 'course-card';

                const headerStyle = `style="background: linear-gradient(135deg, ${config.color}, rgba(0,0,0,0.1));"`;
                
                let filesSectionHTML = '';
                
                if (files.length > 0) {
                    // Add root files first
                    if (organized.root && organized.root.length > 0) {
                        filesSectionHTML += `
                            <div class="folder-section">
                                <div class="folder-title">Main Files</div>
                                <ul class="file-list">
                                    ${organized.root.map(file => `
                                        <li class="file-item">
                                            <span class="file-icon">▪</span>
                                            <a href="javascript:downloadFile('${folderKey}', '${file.name}')" title="${file.name}">${file.name}</a>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }
                    
                    // Add organized folders
                    for (const [folder, folderFiles] of Object.entries(organized)) {
                        if (folder === 'root') continue;
                        
                        const categoryInfo = FOLDER_CATEGORIES[folder] || { name: folder.charAt(0).toUpperCase() + folder.slice(1), icon: '▪' };
                        
                        filesSectionHTML += `
                            <div class="folder-section">
                                <div class="folder-title">${categoryInfo.icon} ${categoryInfo.name}</div>
                                <ul class="file-list">
                                    ${folderFiles.map(file => `
                                        <li class="file-item">
                                            <span class="file-icon">▪</span>
                                            <a href="javascript:downloadFile('${folderKey}', '${file.path}')" title="${file.name}">${file.name}</a>
                                        </li>
                                    `).join('')}
                                </ul>
                            </div>
                        `;
                    }
                }
                
                card.innerHTML = `
                    <div class="course-header" ${headerStyle}>
                        <h3>
                            <span class="course-icon">${config.icon}</span>
                            ${config.name}
                        </h3>
                    </div>
                    <div class="course-body">
                        ${files.length > 0 
                            ? filesSectionHTML
                            : `<div class="empty-state"><p>No files yet</p></div>`
                        }
                        <div class="course-footer">
                            <button class="btn btn-secondary" onclick="promptAddFile('${folderKey}')">
                                Add File
                            </button>
                            ${files.length > 0 ? `<button class="btn btn-danger" onclick="clearCourse('${folderKey}')">Clear All</button>` : ''}
                        </div>
                    </div>
                `;
                
                container.appendChild(card);
            }
        }

        // Upload file
        async function uploadFile() {
            const folder = document.getElementById('folder').value;
            const folderPath = document.getElementById('folderPath').value.trim();
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];

            if (!folder || !file) {
                showStatus('⚠️ Please select a course and file', 'error');
                return;
            }

            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const fileData = {
                        name: file.name,
                        path: folderPath ? `${folderPath}/${file.name}` : file.name,
                        size: file.size,
                        type: file.type,
                        uploaded: new Date().toLocaleString(),
                        data: e.target.result // base64 encoded
                    };

                    // Get existing files
                    let filesObj = getFilesFromLocalStorage(folder);
                    
                    // Add new file
                    filesObj[fileData.path] = fileData;
                    
                    // Save to storage
                    saveFilesToLocalStorage(folder, filesObj);
                    
                    showStatus(`✅ ${file.name} uploaded successfully!`, 'success');
                    fileInput.value = '';
                    document.getElementById('folderPath').value = '';
                    document.getElementById('folder').value = '';
                    
                    // Refresh
                    loadFiles();
                };
                reader.readAsDataURL(file);
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Download file
        function downloadFile(course, filePath) {
            const filesObj = getFilesFromLocalStorage(course);
            const fileData = filesObj[filePath];
            
            if (!fileData) {
                showStatus('File not found', 'error');
                return;
            }
            
            const link = document.createElement('a');
            link.href = fileData.data;
            link.download = fileData.name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Delete file
        function deleteFile(course, filePath) {
            if (confirm(`Delete ${filePath}?`)) {
                let filesObj = getFilesFromLocalStorage(course);
                delete filesObj[filePath];
                saveFilesToLocalStorage(course, filesObj);
                loadFiles();
                showStatus('File deleted', 'success');
            }
        }

        // Clear all files in a course
        function clearCourse(course) {
            if (confirm(`Clear all files from ${COURSE_CONFIG[course].name}?`)) {
                saveFilesToLocalStorage(course, {});
                loadFiles();
                showStatus('Course cleared', 'success');
            }
        }

        // Prompt for adding file to folder
        function promptAddFile(folder) {
            document.getElementById('folder').value = folder;
            document.getElementById('file').click();
        }

        // Refresh data
        function refreshData() {
            const btn = document.querySelector('.btn-refresh');
            const icon = document.getElementById('refresh-icon');
            
            btn.classList.add('loading');
            icon.innerHTML = '<span class="spinner"></span>';
            
            setTimeout(() => {
                loadFiles();
                btn.classList.remove('loading');
                icon.innerHTML = '🔄';
                showStatus('✅ Files refreshed!', 'success');
            }, 500);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', loadFiles);

        // Enter key to upload
        document.getElementById('file').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') uploadFile();
        });
    </script>
</body>
</html>
